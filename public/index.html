<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__TITLE__</title>
<meta property="og:title" content="__OG_TITLE__" />
<meta property="og:description" content="__OG_DESC__" />
<meta property="og:image" content="__OG_IMAGE__" />
<meta property="og:type" content="music.song" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@6..96,400..700&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="hero">
    <div class="hero-photo" id="heroPhoto"></div>
    <div class="hero-scrim"></div>
    <div class="hero-text">
      <p class="eyebrow" id="eyebrow">ON AIR &middot; FULL ALBUM STREAM</p>
      <h1 id="artistName">&nbsp;</h1>
      <h2 id="albumTitle">&nbsp;</h2>
      <p class="tagline" id="tagline"></p>
      <a class="credit" id="credit" href="#"></a>
      <button class="share-album-btn" id="shareAlbumBtn">Share album link</button>
    </div>
  </header>

  <main class="tracklist-wrap">
    <div class="playlist-controls">
      <button class="playlist-btn play-all-btn" id="playAllBtn">Play</button>
      <button class="playlist-btn shuffle-btn" id="shuffleBtn">Shuffle</button>
    </div>
    <div class="tracklist-head">
      <span>Track</span>
      <span class="col-plays">Plays</span>
      <span class="col-likes">Likes</span>
      <span class="col-comments">Comments</span>
      <span class="col-share">Share</span>
    </div>
    <ol class="tracklist" id="tracklist"></ol>
  </main>

  <footer class="player-bar" id="playerBar">
    <div class="player-bar-ambient"></div>
    <div class="player-info">
      <span class="now-dot-wrap">
        <span class="now-dot" id="nowDot"></span>
      </span>
      <span id="nowTitle">Select a track</span>
      <button class="now-share" id="shareNowBtn" aria-label="Share this track">Share</button>
    </div>
    <audio id="audio" preload="none"></audio>
    <div class="player-controls">
      <button id="playPause" aria-label="Play or pause">&#9658;</button>
      <input type="range" id="seek" min="0" max="100" value="0" />
      <span class="time" id="timeDisplay">0:00 / 0:00</span>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <div class="comments-overlay" id="commentsOverlay">
    <div class="comments-panel">
      <div class="comments-panel-header">
        <span id="commentsTrackTitle">Comments</span>
        <button class="comments-close" id="commentsClose" aria-label="Close comments">&times;</button>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <form class="comments-form" id="commentsForm">
        <input type="text" id="commentAuthor" placeholder="Your name" maxlength="60" autocomplete="off" />
        <div class="comments-form-row">
          <input type="text" id="commentText" placeholder="Say something about this track…" maxlength="500" autocomplete="off" required />
          <button type="submit">Post</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/player.js"></script>
</body>
</html>
